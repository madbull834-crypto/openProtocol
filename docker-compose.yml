services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openprotocol
      POSTGRES_PASSWORD: openprotocol
      POSTGRES_DB: openprotocol
    ports: ["5432:5432"]
    volumes: ["openprotocol_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openprotocol"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  openprotocol_postgres:
